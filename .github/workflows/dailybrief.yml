name: Daily Brief

on:
  push:
    branches: [main]
  schedule:
    # GitHub cron is UTC. 23:00 UTC = 07:00 HKT; 10:00 UTC = 18:00 HKT.
    - cron: "0 23 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  models: read

concurrency:
  group: dailybrief-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dailybrief-pipeline/requirements.txt

      - name: Restore brief state
        uses: actions/cache/restore@v4
        with:
          path: |
            dailybrief-pipeline/.cache
            dailybrief/data/archive
            dailybrief/data/today.json
          key: dailybrief-state-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dailybrief-state-v2-

      - name: Install pipeline dependencies
        run: python -m pip install -r dailybrief-pipeline/requirements.txt

      - name: Check Gemini access
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import httpx
          key = os.environ.get('GEMINI_API_KEY', '')
          try:
              response = httpx.get(
                  'https://generativelanguage.googleapis.com/v1beta/models',
                  headers={'x-goog-api-key': key},
                  timeout=30,
              )
              print('Gemini model list HTTP', response.status_code)
              try:
                  payload = response.json()
                  models = [m.get('name') for m in payload.get('models', []) if m.get('name')]
                  print('Available model names:', ', '.join(models) if models else '(none)')
              except Exception:
                  print('Body:', response.text[:500])
          except Exception as error:
              print('Gemini check failed:', type(error).__name__, str(error)[:200])
          PY

      - name: Test the pipeline
        run: python -m unittest discover -s dailybrief-pipeline/tests

      - name: Build the brief
        env:
          # Optional. The default provider order is GitHub Models first, so an
          # empty or absent Gemini key is perfectly fine and cannot bill.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python dailybrief-pipeline/run.py --out dailybrief/data

      - name: Save brief state
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            dailybrief-pipeline/.cache
            dailybrief/data/archive
            dailybrief/data/today.json
          key: dailybrief-state-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Set up Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage the static site
        run: |
          SITE_DIR="$RUNNER_TEMP/site"
          mkdir -p "$SITE_DIR"
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.dev' \
            --exclude='.agents' \
            --exclude='dailybrief-pipeline' \
            --exclude='sync-worker' \
            --exclude='tests' \
            --exclude='node_modules' \
            --exclude='skills-lock.json' \
            ./ "$SITE_DIR/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
