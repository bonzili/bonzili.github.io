# Daily Brief — sources, feeds and the two finite briefs.
# Everything here is free to fetch. No authenticated source, no paid API.

timezone: Asia/Hong_Kong

# Both briefs use an English interface. Article headlines, bullets and
# takeaways stay in the language of the source (English or Traditional Chinese).

summarization:
  # auto = GitHub Models first (built-in GITHUB_TOKEN, free and cannot bill),
  # then Gemini only if no GitHub token and a free key exists, else extractive.
  # There is no paid provider.
  provider: auto
  # Hard stop. 20 picks normally needs ~20 calls; retries and shared cards can
  # use a few more. At 36 the pipeline stops calling and uses extractive text.
  max_calls: 36
  prompt_version: "2026-11-04.1"
  cache_path: dailybrief-pipeline/.cache/summaries.json
  gemini_model: gemini-2.5-flash
  github_model: openai/gpt-4o-mini

workspaces:
  me:
    name:
      en: "Siu Gai Mo's Brief"
      zh: "Siu Gai Mo's Brief"
    description:
      en: "AI, Hong Kong, Mayday, and cybersecurity with a HK desk."
      zh: "AI、香港、五月天，以及全球與香港網絡安全。"
    lang: en
    accent: "#0B6B5D"
    cap: 12
    topic_cap: 4
    topic_caps:
      ai: 4
      hk: 3
      cyber: 4
      mayday: 2
    tag_min:
      cyber:
        HK: 2
    topics: [ai, hk, mayday, cyber]
    topic_weights:
      ai: 1.0
      hk: 1.0
      mayday: 0.9
      cyber: 0.9
    persona: >-
      a Hong Kong commuter who follows AI models, local news, Mayday and
      security. He wants the concrete change and the practical consequence,
      not the press release. Keep it tight enough to read on a train.

  her:
    name:
      en: "Siu Bak's Brief"
      zh: "Siu Bak's Brief"
    description:
      en: "APAC legal with HK priority, Hong Kong news and 易烊千璽."
      zh: "以香港優先的亞太法律、香港新聞與易烊千璽。"
    lang: en
    accent: "#8E3B4A"
    cap: 8
    topic_cap: 4
    topic_caps:
      legal: 5
      hk: 2
      jackson: 2
    tag_min:
      legal:
        HK: 3
    topics: [legal, hk, jackson]
    topic_weights:
      legal: 1.0
      hk: 0.85
      jackson: 0.8
    persona: >-
      a Hong Kong intellectual property lawyer who needs a scannable APAC
      legal brief covering IP, data privacy, fintech, cybersecurity and AI.
      Lead with the jurisdiction, the legal change, and the practical
      consequence. Distinguish law from consultation and commentary. Her
      易烊千璽 updates are a break, not work: keep them light and factual.

